<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="55%" stop-color="#0f1830"/>
      <stop offset="100%" stop-color="#181030"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b57cff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#b57cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#b57cff"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="35"/></filter>
    <clipPath id="typeClip">
      <rect x="440" y="118" width="0" height="64">
        <animate attributeName="width" from="0" to="430" dur="1.4s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
      </rect>
    </clipPath>
    <path id="orbitPath" d="M330,210 A140,140 0 1,1 329.9,210" fill="none"/>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#dots)"/>

  <!-- ambient glow blobs -->
  <circle r="160" fill="url(#glow1)" filter="url(#blur1)">
    <animateMotion dur="14s" repeatCount="indefinite"
      path="M120,90 C260,40 340,220 190,260 C60,300 20,150 120,90 Z"/>
  </circle>
  <circle r="140" fill="url(#glow2)" filter="url(#blur1)">
    <animateMotion dur="17s" repeatCount="indefinite"
      path="M760,300 C880,250 950,120 820,80 C700,50 640,200 760,300 Z"/>
  </circle>

  <!-- orbit ring -->
  <circle cx="190" cy="210" r="140" fill="none" stroke="#58A6FF" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 6"/>

  <!-- central avatar -->
  <circle cx="190" cy="210" r="72" fill="url(#avatarGrad)" opacity="0.15"/>
  <circle cx="190" cy="210" r="66" fill="#0b0f19" stroke="url(#avatarGrad)" stroke-width="2.5"/>
  <text x="190" y="225" font-family="'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="#e6edf3" text-anchor="middle">SP</text>

  <!-- orbiting tech pills -->
  <g font-family="'JetBrains Mono', monospace" font-size="13" fill="#e6edf3">
    <g><rect x="-38" y="-12" width="76" height="24" rx="12" fill="#111a2e" stroke="#58A6FF" stroke-opacity="0.5"/><text x="0" y="5" text-anchor="middle">Python</text>
      <animateMotion dur="18s" begin="-0s" repeatCount="indefinite"><mpath xlink:href="#orbitPath"/></animateMotion></g>
    <g><rect x="-52" y="-12" width="104" height="24" rx="12" fill="#111a2e" stroke="#b57cff" stroke-opacity="0.5"/><text x="0" y="5" text-anchor="middle">TensorFlow</text>
      <animateMotion dur="18s" begin="-3s" repeatCount="indefinite"><mpath xlink:href="#orbitPath"/></animateMotion></g>
    <g><rect x="-54" y="-12" width="108" height="24" rx="12" fill="#111a2e" stroke="#58A6FF" stroke-opacity="0.5"/><text x="0" y="5" text-anchor="middle">LangChain</text>
      <animateMotion dur="18s" begin="-6s" repeatCount="indefinite"><mpath xlink:href="#orbitPath"/></animateMotion></g>
    <g><rect x="-42" y="-12" width="84" height="24" rx="12" fill="#111a2e" stroke="#b57cff" stroke-opacity="0.5"/><text x="0" y="5" text-anchor="middle">Next.js</text>
      <animateMotion dur="18s" begin="-9s" repeatCount="indefinite"><mpath xlink:href="#orbitPath"/></animateMotion></g>
    <g><rect x="-40" y="-12" width="80" height="24" rx="12" fill="#111a2e" stroke="#58A6FF" stroke-opacity="0.5"/><text x="0" y="5" text-anchor="middle">Android</text>
      <animateMotion dur="18s" begin="-12s" repeatCount="indefinite"><mpath xlink:href="#orbitPath"/></animateMotion></g>
    <g><rect x="-34" y="-12" width="68" height="24" rx="12" fill="#111a2e" stroke="#b57cff" stroke-opacity="0.5"/><text x="0" y="5" text-anchor="middle">GenAI</text>
      <animateMotion dur="18s" begin="-15s" repeatCount="indefinite"><mpath xlink:href="#orbitPath"/></animateMotion></g>
  </g>

  <!-- terminal prompt -->
  <text x="440" y="90" font-family="'JetBrains Mono', monospace" font-size="16" fill="#6e7681">~/portfolio</text>
  <text x="440" y="112" font-family="'JetBrains Mono', monospace" font-size="16" fill="#3fb950">➜ whoami</text>

  <!-- typed name -->
  <text x="440" y="163" font-family="'Segoe UI', sans-serif" font-size="46" font-weight="700" fill="#e6edf3" clip-path="url(#typeClip)" textLength="430" lengthAdjust="spacingAndGlyphs">Saswata Pal</text>
  <rect x="440" width="3" height="50" y="122" fill="#58A6FF">
    <animate attributeName="x" from="440" to="870" dur="1.4s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" begin="1.9s" repeatCount="indefinite"/>
  </rect>

  <!-- cycling subtitle -->
  <g font-family="'JetBrains Mono', monospace" font-size="21" fill="#58A6FF">
    <text x="440" y="205" opacity="0">
      AI &amp; ML Engineer
      <animate id="s1" attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3s" begin="2.2s;s4.end" fill="freeze"/>
    </text>
    <text x="440" y="205" opacity="0">
      Android Developer
      <animate id="s2" attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3s" begin="s1.end" fill="freeze"/>
    </text>
    <text x="440" y="205" opacity="0">
      GenAI Innovator
      <animate id="s3" attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3s" begin="s2.end" fill="freeze"/>
    </text>
    <text x="440" y="205" opacity="0">
      Building intelligent, inclusive systems
      <animate id="s4" attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3.4s" begin="s3.end" fill="freeze"/>
    </text>
  </g>

  <!-- quick stat badges -->
  <g font-family="'JetBrains Mono', monospace" font-size="14" fill="#e6edf3">
    <g opacity="0">
      <rect x="440" y="250" width="140" height="34" rx="17" fill="#111a2e" stroke="#30363d"/>
      <text x="510" y="272" text-anchor="middle">9.23 CGPA</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.2s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="592" y="250" width="160" height="34" rx="17" fill="#111a2e" stroke="#30363d"/>
      <text x="672" y="272" text-anchor="middle">10+ Hackathons</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.5s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="764" y="250" width="190" height="34" rx="17" fill="#111a2e" stroke="#30363d"/>
      <text x="859" y="272" text-anchor="middle">2 Research Papers</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.8s" fill="freeze"/>
    </g>
  </g>

  <!-- bottom divider line -->
  <line x1="440" y1="320" x2="1150" y2="320" stroke="#30363d" stroke-width="1">
    <animate attributeName="x2" from="440" to="1150" dur="1s" begin="4s" fill="freeze"/>
  </line>
  <text x="440" y="350" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6e7681" opacity="0">
    "Everything is Mathematics."
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="4.2s" fill="freeze"/>
  </text>
</svg>
