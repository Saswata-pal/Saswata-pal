<svg width="1200" height="140" viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#0f1830"/>
    </linearGradient>
    <linearGradient id="fadeMask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="8%" stop-color="white" stop-opacity="1"/>
      <stop offset="92%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="edgeFade">
      <rect width="1200" height="140" fill="url(#fadeMask)"/>
    </mask>
  </defs>

  <rect width="1200" height="140" fill="url(#bg2)"/>

  <g mask="url(#edgeFade)" font-family="'JetBrains Mono', monospace" font-size="15" fill="#e6edf3">

    <!-- row 1: scrolls left -->
    <g id="row1">
      <g transform="translate(0,35)">
        <!-- set A -->
        <g id="rowA">
          <rect x="20"  y="0" width="90"  height="34" rx="17" fill="#111a2e" stroke="#58A6FF" stroke-opacity="0.5"/><text x="65"  y="22" text-anchor="middle">Python</text>
          <rect x="130" y="0" width="130" height="34" rx="17" fill="#111a2e" stroke="#b57cff" stroke-opacity="0.5"/><text x="195" y="22" text-anchor="middle">TensorFlow</text>
          <rect x="280" y="0" width="100" height="34" rx="17" fill="#111a2e" stroke="#58A6FF" stroke-opacity="0.5"/><text x="330" y="22" text-anchor="middle">PyTorch</text>
          <rect x="400" y="0" width="140" height="34" rx="17" fill="#111a2e" stroke="#b57cff" stroke-opacity="0.5"/><text x="470" y="22" text-anchor="middle">LangChain</text>
          <rect x="560" y="0" width="100" height="34" rx="17" fill="#111a2e" stroke="#58A6FF" stroke-opacity="0.5"/><text x="610" y="22" text-anchor="middle">CrewAI</text>
          <rect x="680" y="0" width="110" height="34" rx="17" fill="#111a2e" stroke="#b57cff" stroke-opacity="0.5"/><text x="735" y="22" text-anchor="middle">Next.js</text>
          <rect x="810" y="0" width="130" height="34" rx="17" fill="#111a2e" stroke="#58A6FF" stroke-opacity="0.5"/><text x="875" y="22" text-anchor="middle">Firebase</text>
          <rect x="960" y="0" width="120" height="34" rx="17" fill="#111a2e" stroke="#b57cff" stroke-opacity="0.5"/><text x="1020" y="22" text-anchor="middle">OpenCV</text>
        </g>
        <use xlink:href="#rowA" x="1120"/>
        <animateTransform attributeName="transform" attributeType="XML" type="translate"
          from="0,0" to="-1120,0" dur="22s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- row 2: scrolls right -->
    <g id="row2">
      <g transform="translate(0,90)">
        <g id="rowB">
          <rect x="20"  y="0" width="110" height="34" rx="17" fill="#111a2e" stroke="#3fb950" stroke-opacity="0.5"/><text x="75"  y="22" text-anchor="middle">Android</text>
          <rect x="150" y="0" width="90"  height="34" rx="17" fill="#111a2e" stroke="#58A6FF" stroke-opacity="0.5"/><text x="195" y="22" text-anchor="middle">Kotlin</text>
          <rect x="260" y="0" width="140" height="34" rx="17" fill="#111a2e" stroke="#b57cff" stroke-opacity="0.5"/><text x="330" y="22" text-anchor="middle">Gemini API</text>
          <rect x="420" y="0" width="130" height="34" rx="17" fill="#111a2e" stroke="#3fb950" stroke-opacity="0.5"/><text x="485" y="22" text-anchor="middle">Vertex AI</text>
          <rect x="570" y="0" width="90"  height="34" rx="17" fill="#111a2e" stroke="#58A6FF" stroke-opacity="0.5"/><text x="615" y="22" text-anchor="middle">TFLite</text>
          <rect x="680" y="0" width="70"  height="34" rx="17" fill="#111a2e" stroke="#b57cff" stroke-opacity="0.5"/><text x="715" y="22" text-anchor="middle">n8n</text>
          <rect x="770" y="0" width="90"  height="34" rx="17" fill="#111a2e" stroke="#3fb950" stroke-opacity="0.5"/><text x="815" y="22" text-anchor="middle">Ollama</text>
          <rect x="880" y="0" width="130" height="34" rx="17" fill="#111a2e" stroke="#58A6FF" stroke-opacity="0.5"/><text x="945" y="22" text-anchor="middle">YOLOv5</text>
          <rect x="1030" y="0" width="60" height="34" rx="17" fill="#111a2e" stroke="#b57cff" stroke-opacity="0.5"/><text x="1060" y="22" text-anchor="middle">Git</text>
        </g>
        <use xlink:href="#rowB" x="-1120"/>
        <animateTransform attributeName="transform" attributeType="XML" type="translate"
          from="0,0" to="1120,0" dur="26s" repeatCount="indefinite"/>
      </g>
    </g>

  </g>
</svg>
