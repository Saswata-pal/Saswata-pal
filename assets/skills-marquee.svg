<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#0f1830"/>
    </linearGradient>
    <linearGradient id="fadeMaskV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="white" stop-opacity="0"/>
      <stop offset="18%" stop-color="white" stop-opacity="1"/>
      <stop offset="82%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="edgeFadeV">
      <rect width="1200" height="220" fill="url(#fadeMaskV)"/>
    </mask>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" fill="url(#bg2)"/>

  <!-- thin column separators for structure -->
  <g stroke="#1c2740" stroke-width="1">
    <line x1="240" y1="0" x2="240" y2="220"/>
    <line x1="480" y1="0" x2="480" y2="220"/>
    <line x1="720" y1="0" x2="720" y2="220"/>
    <line x1="960" y1="0" x2="960" y2="220"/>
